<div class="header d-flex mb-2 justify-content-between align-items-center p-2 border-bottom border-secondary">
  <div class="d-flex align-items-center">
    <label class="me-2 text-light d-flex align-items-center px-3 fw-bold input-group-text">Năm</label>
    <input type="number" class="form-control me-3" [(ngModel)]="currentYear" (ngModelChange)="updateDayOptions()"
      style="width: 90px; background: #2b2b2b; color: #fff; border: 1px solid #444;">

    <label class="me-2 text-light d-flex align-items-center px-3 fw-bold input-group-text">Tháng</label>
    <ngx-select class="me-3 custom-select" [items]="monthOptions" [optionValueField]="'value'"
      [optionTextField]="'label'" [(ngModel)]="monthOptionValue" (ngModelChange)="updateDayOptions()"
      style="width: 115px;"></ngx-select>

    <label class="me-2 text-light d-flex align-items-center px-3 fw-bold input-group-text">Ngày</label>
    <ngx-select class="me-3 custom-select" [items]="dayOptions" [optionValueField]="'value'" [optionTextField]="'label'"
      [(ngModel)]="dayOptionValue" style="width: 115px;"></ngx-select>

    <button class="btn btn-primary d-flex align-items-center ms-1" (click)="loadAllChartData()">
      <i class="bi bi-search me-1"></i>Load Data
    </button>
  </div>

  <!-- Shared Legend -->
  <div class="shared-legend d-flex flex-wrap justify-content-center">
    @for (area of areaList; track area.name) {
    <div class="legend-item d-flex align-items-center me-3 mb-1">
      <span class="legend-color me-1" [style.background-color]="area.color"></span>
      <span class="legend-label text-light small">{{ area.name }}</span>
    </div>
    }
  </div>
</div>

<div class="card position-relative bg-dark border-0">
  @if (isLoading) {
  <div class="loading-overlay d-flex justify-content-center align-items-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  }

  <div class="card-body p-2 h-100">
    <div class="content-wrapper">
      <div class="summary-section row">
        <div class="col-6 py-2">
          <div #electricUsageChart class="cell" echarts [options]="topCenterChartOption"></div>
        </div>
        <div class="col-6 py-2">
          <div #yearlyElectricUsageByAreaChart class="cell shadow-sm" echarts
            [options]="yearlyElectricUsageChartOption"></div>
        </div>
      </div>
      <div class="chart-section row">
        <div class="col-6 py-2">
          <div #monthlyElectricUsageByAreaChart class="cell shadow-sm" echarts
            [options]="monthlyElectricUsageChartOption"></div>
        </div>
        <div class="col-6 py-2">
          <div #dailyElectricUsageByAreaChart class="cell shadow-sm" echarts [options]="dailyElectricUsageChartOption">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
