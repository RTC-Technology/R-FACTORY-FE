<div class="header d-flex mb-2 align-items-center">
  <div class="d-flex align-items-center">
    <label class="px-1 fs-14">Năm:</label>
    <nz-input-number [(ngModel)]="yearValue" [nzMin]="2000" [nzMax]="2100" [nzStep]="1" class="me-2 fs-14"
      style="width: 80px;" (ngModelChange)="updateDayOptions()"></nz-input-number>

    <label class="px-1 fs-14">Tháng:</label>
    <nz-select class="me-2 fs-14" [(ngModel)]="monthOptionValue" (ngModelChange)="updateDayOptions()"
      style="width: 120px;">
      @for (option of monthOptions; track option.value) {
      <nz-option [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
      }
    </nz-select>

    <label class="px-1 fs-14">Ngày:</label>
    <nz-select class="me-2 fs-14" [(ngModel)]="dayOptionValue" style="width: 120px;">
      @for (option of dayOptions; track option.value) {
      <nz-option [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
      }
    </nz-select>

    <label class="px-1 fs-14">Khu vực:</label>
    <nz-select class="me-2 fs-14" [(ngModel)]="deviceId" style="width: 250px;">
      @for (device of devices; track device.Id) {
      <nz-option [nzValue]="device.Id" [nzLabel]="device.DeviceName"></nz-option>
      }
    </nz-select>
  </div>
  <button nz-button nzType="primary" class="d-flex align-items-center fs-14" (click)="loadData()">
    <i nz-icon nzType="search"></i>
    <span class="ms-1">Tìm kiếm</span>
  </button>
</div>
<div class="card position-relative">
  @if (isLoading) {
  <div class="loading-overlay d-flex justify-content-center align-items-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  }
  <div class="card-body">
    <div class="row h-50">
      <div #powerRate class="col-12 h-100" echarts [options]="powerRateChartOption"></div>
    </div>
    <div class="row h-50">
      <div #wasteOutput class="col-12 h-100" echarts [options]="wasteOutputChartOption"></div>
    </div>
  </div>
</div>
