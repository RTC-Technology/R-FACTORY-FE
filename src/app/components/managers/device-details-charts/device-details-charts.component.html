<div class="header d-flex mb-2 align-items-center">
  <div class="d-flex align-items-center">
    <label class="px-1 fs-14">Khu vực:</label>
    <nz-select class="me-2 fs-14" [(ngModel)]="deviceId" (ngModelChange)="loadData()" style="width: 250px;">
      @for (device of devices; track device.Id) {
      <nz-option [nzValue]="device.Id" [nzLabel]="device.DeviceName"></nz-option>
      }
    </nz-select>
  </div>
</div>
<div class="card position-relative">
  @if (isLoading) {
  <div class="loading-overlay d-flex justify-content-center align-items-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  }
  <div class="card-body">
    <div class="row h-50">
      <div class="col-12 h-100 position-relative">
        <div class="chart-filters d-flex gap-2 position-absolute top-0 start-0 m-2" style="z-index: 10;">
          <nz-date-picker nzMode="year" [(ngModel)]="monthlyChartDate"
            (ngModelChange)="onMonthlyChartInputChange($event)" nzSize="small" style="width: 80px;" nzPlaceHolder="Năm"
            [nzAllowClear]="false"></nz-date-picker>
        </div>
        <div #monthlyPowerChart class="h-100 w-100" echarts [options]="monthlyPowerChartOption"></div>
      </div>
    </div>
    <div class="row h-50">
      <div class="col-12 h-100 position-relative">
        <div class="chart-filters d-flex gap-2 position-absolute top-0 start-0 m-2" style="z-index: 10;">
          <nz-date-picker nzMode="month" [(ngModel)]="dailyChartDate" (ngModelChange)="onDailyChartInputChange($event)"
            nzSize="small" nzFormat="MM/yyyy" style="width: 120px;" [nzAllowClear]="false"></nz-date-picker>
        </div>
        <div #dailyPowerChart class="h-100 w-100" echarts [options]="dailyPowerChartOption"></div>
      </div>
    </div>
  </div>
</div>
